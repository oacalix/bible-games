<style>
:root{
  --sky:#2fa8de; --ink:#1b1f3b; --soft:#4b5170;
  --yel:#ffd23f; --grn:#3ddc84; --org:#ff8c42; --pnk:#ff6b9a; --pur:#9b72f2; --red:#ff4d4d;
  --disp:'Bungee','Arial Black',Impact,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#1f86b8; } }
:root[data-theme="dark"]{ --sky:#1f86b8; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:'Nunito',system-ui,'Segoe UI',Arial,sans-serif;font-weight:600;
  background-color:var(--sky);
  background-image:repeating-conic-gradient(from 0deg at 50% -10%, rgba(255,255,255,.10) 0deg 8deg, transparent 8deg 16deg)}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--yel);outline-offset:3px}

/* ---------- layout a pantalla completa ---------- */
.app{height:100%;display:flex;flex-direction:column;gap:1.4vh;padding:1.6vh 1.6vw}
header{display:flex;align-items:center;gap:1.2vw;flex:none}
h1{margin:0;font-family:var(--disp);font-weight:400;color:#fff;line-height:1;flex:0 1 auto;max-width:38%;
  font-size:clamp(1rem,min(2.6vw,4.4vh),2.6rem);text-shadow:3px 3px 0 var(--ink)}
.turn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--ink);border-radius:12px;
  box-shadow:4px 4px 0 var(--ink);padding:.8vh 14px;font-weight:900;font-size:clamp(.9rem,min(1.6vw,2.7vh),1.5rem);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn .dot{width:1.2em;height:1.2em;border-radius:50%;border:3px solid var(--ink);background:var(--c);flex:none}
.ctrls{display:flex;gap:8px;flex:none}
.chip{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:.7vh 12px;font-weight:800;font-size:clamp(.8rem,min(1.1vw,2vh),1.05rem);box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:auto repeat(5,minmax(0,1fr));gap:1.3vh 1.2vw}
.cat{background:var(--c);border:4px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);
  padding:.9vh 6px;text-align:center;display:flex;align-items:center;justify-content:center;gap:.5em;line-height:1.1;
  font-weight:900;font-size:clamp(.75rem,min(1.6vw,2.7vh),1.5rem)}
.cat .ic{font-size:1.3em;line-height:1}
.tile{position:relative;height:100%;min-height:0;background:#fff;border:4px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);
  font-family:var(--disp);font-size:clamp(1rem,min(4vw,6.5vh),4.2rem);overflow:hidden;transition:transform .1s,box-shadow .1s;padding:0}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:16%;background:var(--c);border-bottom:3px solid var(--ink)}
.tile span{position:relative;top:6%}
.tile:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.tile:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tile:disabled{background:rgba(255,255,255,.12);border:3px dashed rgba(255,255,255,.55);box-shadow:none;cursor:default}
.tile:disabled::before,.tile:disabled span{display:none}

.scores{flex:none;display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:1.2vw}
.team{background:#fff;border:4px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);
  padding:.6vh 12px;display:flex;align-items:center;gap:10px}
.team .sw{width:14px;align-self:stretch;border-radius:6px;background:var(--c);border:2px solid var(--ink);flex:none}
.team .nm{flex:1;min-width:0;font-weight:900;font-size:clamp(.85rem,min(1.4vw,2.4vh),1.3rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .pt{font-family:var(--disp);font-size:clamp(1.1rem,min(2.4vw,4vh),2.4rem)}
.team .adj{display:flex;flex-direction:column;gap:2px}
.team .adj button{background:#fff;border:2px solid var(--ink);border-radius:6px;font-size:.68rem;font-weight:800;padding:0 5px;line-height:1.3}
.team.now{background:var(--c)}

/* pantallas bajitas (celular acostado): mismo tablero con scroll */
@media (max-height:480px) and (min-width:701px){
  body{overflow:auto;height:auto;min-height:100%}
  .app{height:auto}
  .board{grid-template-rows:auto;grid-auto-rows:64px}
}
/* celular */
@media (max-width:700px){
  body{overflow:auto;height:auto;min-height:100%}
  .app{height:auto;padding:10px 10px 0;gap:10px}
  header{flex-wrap:wrap;gap:8px}
  h1{max-width:none;flex:1 1 0;font-size:1.3rem}
  .ctrls{gap:6px}
  .chip{padding:6px 9px;font-size:1.05rem;box-shadow:2px 2px 0 var(--ink)}
  .chip .ct{display:none}
  .turn{order:3;flex-basis:100%;white-space:normal;font-size:1rem;padding:8px 12px;box-shadow:3px 3px 0 var(--ink)}
  .board.m{grid-template-rows:none;grid-auto-rows:auto;gap:6px}
  .board.m .cat{grid-column:1/-1;justify-content:flex-start;padding:6px 12px;font-size:1rem;margin-top:8px;border-width:3px;box-shadow:3px 3px 0 var(--ink)}
  .board.m .cat:first-child{margin-top:0}
  .board.m .tile{height:52px;font-size:1rem;border-width:3px;box-shadow:3px 3px 0 var(--ink)}
  .board.m .tile:disabled{box-shadow:none}
  .scores{position:sticky;bottom:0;z-index:5;margin:6px -10px 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--sky);border-top:4px solid var(--ink);grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .team{padding:6px 8px;gap:6px;border-width:3px;box-shadow:3px 3px 0 var(--ink)}
  .team{flex-wrap:wrap;row-gap:4px}
  .team .sw{display:none}
  .team .nm{flex-basis:100%;font-size:.95rem;border-bottom:3px solid var(--c);padding-bottom:2px}
  .team .pt{flex:1}
  .team .adj{flex-direction:row}
  .team.now .nm{border-color:var(--ink)}
  .team .pt{font-size:1.2rem}
  .overlay{padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .card{border-width:4px;box-shadow:5px 5px 0 var(--ink);padding:16px}
  #qov .card{display:flex;flex-direction:column;min-height:100%}
  .q{font-size:1.35rem;margin:14px 0 12px}
  .who{font-size:1rem}
  .opt{font-size:1.1rem;padding:10px 12px}
  .ans .t{font-size:1.3rem}
  #acts{display:grid;grid-template-columns:1fr 1fr;margin-top:auto;padding-top:14px}
  #acts .btn{width:100%;text-align:center;padding:14px 10px}
  #acts #optBtn,#acts #backBtn,#acts #nextBtn{grid-column:1/-1}
  .btn.ghost{margin-left:0}
  .themes,.names{grid-template-columns:1fr}
}

/* ---------- ventanas ---------- */
.overlay{position:fixed;inset:0;background:rgba(27,31,59,.78);display:none;align-items:center;justify-content:center;
  padding:calc(2vh + env(safe-area-inset-top,0px)) 2vw calc(2vh + env(safe-area-inset-bottom,0px));z-index:10}
.overlay.on{display:flex}
.card{background:#fff;border:5px solid var(--ink);border-radius:16px;box-shadow:10px 10px 0 var(--ink);
  max-width:1000px;width:100%;max-height:100%;overflow:auto;padding:clamp(16px,3vh,32px) clamp(16px,3vw,36px);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9) rotate(-1deg);opacity:0}to{transform:none;opacity:1}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{background:var(--c);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:900}
.val{font-family:var(--disp);font-size:1.4rem;background:var(--yel);border:3px solid var(--ink);border-radius:10px;padding:2px 12px}
.val.x2{background:var(--red);color:#fff}
.who{margin:14px 0 0;display:flex;align-items:center;gap:10px;background:var(--c);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:900;font-size:clamp(1.05rem,min(2.4vw,3.4vh),1.6rem)}
.who.steal{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
.q{margin:2.4vh 0 2vh;font-weight:900;font-size:clamp(1.35rem,min(3.4vw,5.4vh),3rem);line-height:1.2}
.timer{height:14px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#eef2f7}
.timer i{display:block;height:100%;width:100%;background:var(--grn);transition:width .1s linear}
.opts{display:grid;gap:1.2vh;margin:1.8vh 0}
.opts:empty{display:none}
.opt{text-align:left;background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);
  padding:1vh 14px;display:flex;gap:12px;align-items:center;font-weight:900;font-size:clamp(1.05rem,min(2.4vw,3.8vh),2rem);line-height:1.15}
.opt b{font-family:var(--disp);font-weight:400;background:var(--yel);border:3px solid var(--ink);border-radius:8px;width:2em;height:2em;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:.8em}
.opt.ok{background:var(--grn)}
.opt.no{background:#ffd6d6;opacity:.7;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ans{display:none;background:var(--grn);border:3px solid var(--ink);border-radius:12px;padding:12px 16px;margin:14px 0}
.ans.on{display:block;animation:pop .22s}
.ans .t{font-weight:900;font-size:clamp(1.25rem,min(3vw,4.6vh),2.4rem)}
.ans .n{margin-top:6px;font-size:1.1rem}
.ans .r{margin-top:6px;font-size:1rem}
.result{font-family:var(--disp);font-size:clamp(1.1rem,3vw,1.8rem);margin:10px 0 0;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:10px 18px;font-size:clamp(1rem,min(1.6vw,2.6vh),1.35rem);font-weight:900;background:#fff}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.g{background:var(--grn)} .btn.r{background:var(--red);color:#fff} .btn.y{background:var(--yel)} .btn.p{background:var(--pur);color:#fff}
.btn.ghost{box-shadow:none;border-style:dashed;margin-left:auto}

.bonus{text-align:center;padding:16px 0}
.bonus .ic{font-size:clamp(3rem,12vh,7rem)}
.bonus .big{font-family:var(--disp);font-size:clamp(2rem,9vh,5rem);color:var(--red);text-shadow:3px 3px 0 var(--ink);animation:net .6s ease-out;line-height:1.1}
.bonus p{font-size:1.4rem;font-weight:800}
@keyframes net{0%{transform:scale(.3) rotate(-10deg)}70%{transform:scale(1.12) rotate(3deg)}100%{transform:none}}

.setup h2,.end h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(1.4rem,4vw,2.2rem)}
.setup .lbl{display:block;margin:18px 0 8px;font-weight:900;font-size:1.1rem}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 14px;font-weight:900;font-size:1.05rem;box-shadow:3px 3px 0 var(--ink);text-align:left}
.pick button small{display:block;font-weight:600;font-size:.82rem;color:var(--soft)}
.pick button.sel{background:var(--yel)}
.pick button.num{font-family:var(--disp);font-weight:400;font-size:1.3rem;padding:6px 18px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.themes button{display:flex;align-items:center;gap:10px}
.themes .ti{font-size:1.8rem}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.names input{width:100%;font-family:inherit;font-weight:800;font-size:1.1rem;padding:10px 12px;border-radius:10px;border:3px solid var(--ink);background:var(--c)}
.hint{margin:16px 0 0;color:var(--soft);font-size:.92rem}
.rank{list-style:none;padding:0;margin:16px 0}
.rank li{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:3px solid var(--ink);border-radius:10px;margin-bottom:8px;font-weight:900;font-size:1.2rem;background:#fff}
.rank li span:last-child{font-family:var(--disp)}
.rank li:first-child{background:var(--c);font-size:1.5rem;box-shadow:4px 4px 0 var(--ink)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <div class="turn" id="turn"></div>
    <div class="ctrls">
      <button class="chip" id="langBtn"></button>
      <button class="chip" id="timeBtn"></button>

      <button class="chip" id="newBtn"></button>

<script>
const TEAM_COLORS=['#ffd23f','#ff6b9a','#3ddc84','#9b72f2'];
const CAT_COLORS=['#ffd23f','#3ddc84','#ff8c42','#ff6b9a','#9b72f2'];
/* Formato de cada pregunta:
   [pregunta ES, pregunta EN, [opciones ES], [opciones EN], "Libro ES / Book EN cap:vers", nota ES, nota EN]
   La primera opción siempre es la correcta (en pantalla se barajan). */
const THEMES=[
{id:'jesus',ic:'✝️',t:['La vida de Jesús','The Life of Jesus'],cats:[
 {ic:'⭐',n:['Nacimiento','Birth'],qs:[
  ['¿En qué pueblo nació Jesús?','In what town was Jesus born?',['Belén','Nazaret','Jerusalén'],['Bethlehem','Nazareth','Jerusalem'],'Lucas / Luke 2:4-7'],
  ['No había lugar en el mesón. ¿Dónde acostó María al bebé Jesús?','There was no room at the inn. Where did Mary lay baby Jesus?',['En un pesebre','En una cuna de oro','En una canasta'],['In a manger','In a golden crib','In a basket'],'Lucas / Luke 2:7'],
  ['Un ángel les dio la buena noticia mientras cuidaban sus ovejas de noche. ¿Quiénes eran?','An angel brought them good news while they watched their sheep at night. Who were they?',['Los pastores','Los soldados','Los reyes'],['The shepherds','The soldiers','The kings'],'Lucas / Luke 2:8-11'],
  ['¿Qué siguieron los sabios de oriente para encontrar a Jesús?','What did the wise men from the east follow to find Jesus?',['Una estrella','Un río','Un camello guía'],['A star','A river','A guide camel'],'Mateo / Matthew 2:9-10'],
  ['¿Cuáles fueron los tres regalos que los sabios le dieron a Jesús?','What three gifts did the wise men give Jesus?',['Oro, incienso y mirra','Oro, plata y perlas','Pan, miel y aceite'],['Gold, frankincense and myrrh','Gold, silver and pearls','Bread, honey and oil'],'Mateo / Matthew 2:11']]},
 {ic:'✨',n:['Milagros','Miracles'],qs:[
  ['En una boda, Jesús hizo su primer milagro. ¿En qué convirtió el agua?','At a wedding Jesus did his first miracle. What did he turn the water into?',['En vino','En leche','En jugo de naranja'],['Wine','Milk','Orange juice'],'Juan / John 2:1-11'],
  ['Con cinco panes y dos peces, Jesús alimentó a unos…','With five loaves and two fish, Jesus fed about…',['5,000 hombres','50 hombres','500 hombres'],['5,000 men','50 men','500 men'],'Mateo / Matthew 14:21','¡Sin contar a las mujeres y los niños!','Not even counting the women and children!'],
  ['Una noche, los discípulos vieron a Jesús caminando sobre…','One night the disciples saw Jesus walking on…',['El agua','El fuego','Las nubes'],['The water','Fire','The clouds'],'Mateo / Matthew 14:25'],
  ['Jesús llamó a su amigo para que saliera de la tumba después de 4 días. ¿Cómo se llamaba?','Jesus called his friend out of the tomb after 4 days. What was his name?',['Lázaro','Zaqueo','Nicodemo'],['Lazarus','Zacchaeus','Nicodemus'],'Juan / John 11:39-44'],
  ['Jesús le habló al viento y la tormenta se calmó. ¿En qué mar estaban?','Jesus spoke to the wind and the storm calmed down. What sea were they on?',['El mar de Galilea','El mar Rojo','El mar Muerto'],['The Sea of Galilee','The Red Sea','The Dead Sea'],'Marcos / Mark 4:35-41']]},
 {ic:'🌱',n:['Parábolas','Parables'],qs:[
  ['Un pastor tenía 100 ovejas. ¿Cuántas se le perdieron para que saliera a buscarlas?','A shepherd had 100 sheep. How many got lost so he went searching?',['Una','Diez','Cincuenta'],['One','Ten','Fifty'],'Lucas / Luke 15:4-6'],
  ['¿Quién se detuvo a ayudar al hombre herido en el camino?','Who stopped to help the hurt man on the road?',['Un samaritano','Un sacerdote','Un soldado romano'],['A Samaritan','A priest','A Roman soldier'],'Lucas / Luke 10:30-35','El sacerdote y el levita pasaron de largo.','The priest and the Levite walked right past.'],
  ['El hombre sabio construyó su casa sobre…','The wise man built his house on…',['La roca','La arena','El lodo'],['The rock','The sand','The mud'],'Mateo / Matthew 7:24-27'],
  ['El hijo que malgastó toda su herencia terminó cuidando…','The son who wasted all his money ended up taking care of…',['Cerdos','Camellos','Gallinas'],['Pigs','Camels','Chickens'],'Lucas / Luke 15:15-24','¡Y cuando volvió, su papá le hizo una fiesta!','And when he came home, his dad threw him a party!'],
  ['Jesús comparó el reino de Dios con una semilla pequeñita que crece hasta ser un árbol. ¿Qué semilla era?','Jesus compared God’s kingdom to a tiny seed that grows into a tree. What seed was it?',['De mostaza','De manzana','De girasol'],['A mustard seed','An apple seed','A sunflower seed'],'Mateo / Matthew 13:31-32']]},

let AC=null;
function tone(f,d,type='sine',delay=0,vol=.15){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+delay;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g).connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}
}

  buzz(){tone(150,.45,'sawtooth',0,.1)},
  tick(){tone(1000,.05,'square',0,.04)},

  steal(){tone(300,.1,'square',0,.07);tone(450,.1,'square',.1,.07);tone(300,.1,'square',.2,.07);tone(450,.15,'square',.3,.07)},
  bonus(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',i*.09))},

const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function burst(n=120){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=innerWidth;cv.height=innerHeight;const cols=CAT_COLORS.concat('#ffffff');
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,
    s:Math.random()*9+6,c:cols[i%cols.length],r:Math.random()*6,life:130});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.strokeStyle='#1b1f3b';cx.lineWidth=1.5;
    cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

function openQ(k){
  const [ci,r]=k.split('-').map(Number),q=TH().cats[ci].qs[r];
  cur={k,ci,r,q,order:[0,1,2].sort(()=>Math.random()-.5),val:(r+1)*100*(k===S.bonus?2:1),
       ans:S.turn,stolen:false,done:false,shownOpts:D().auto,wrongOpts:[],result:''};
  $('qov').classList.add('on');save();
  if(k===S.bonus){sfx.bonus();burst(60);drawBonus();}

}
function drawBonus(){
  $('qcard').innerHTML=`<div class="bonus"><div class="ic" aria-hidden="true">🎣</div><div class="big">${t('bonus')}</div>
    <p>${t('bonusSub')}</p><button class="btn y" id="goQ">${t('go')}</button></div>`;
  $('goQ').focus();
}
function drawQ(){
  const e=E(),v=qv(cur.q),{val,ci,ans}=cur,isB=cur.k===S.bonus,tm=S.teams[ans],cat=TH().cats[ci];
  const who=cur.done?'':`<div class="who${cur.stolen?' steal':''}" style="--c:${TEAM_COLORS[ans]}">${esc((cur.stolen?t('steal'):t('answering'))(tm.name))}</div>`;
  const keep=$('tb')?$('tb').style.cssText:'';
  $('qcard').innerHTML=`<div class="qhead"><span class="tag" style="--c:${CAT_COLORS[ci]}">${cat.ic} ${esc(cat.n[e])}</span>
     <span class="val${isB?' x2':''}">${val}${isB?' ×2':''}</span></div>
   ${who}
   <div class="q">${esc(v.q)}</div>
   ${cur.done||!S.timer?'':`<div class="timer"><i id="tb" style="${keep}"></i></div>`}
   <div class="opts" id="opts">${cur.shownOpts&&D().opts?optsHTML():''}</div>
   <div class="ans${cur.done?' on':''}" id="ans"><div class="t">✅ ${esc(v.o[0])}</div>
     ${v.n?`<div class="n">${esc(v.n)}</div>`:''}<div class="r">📖 ${esc(v.r)}</div></div>
   ${cur.result?`<div class="result">${esc(cur.result)}</div>`:''}
   <div class="row" id="acts">${actsHTML()}</div>`;
}
function optsHTML(){
  const o=qv(cur.q).o;
  return cur.order.map((oi,i)=>{
    const cls=cur.done&&oi===0?' ok':cur.wrongOpts.includes(oi)?' no':'';
    const dis=cur.done||cur.wrongOpts.includes(oi)?'disabled':'';
    return `<button class="opt${cls}" data-o="${oi}" ${dis}><b>${'ABC'[i]}</b><span>${esc(o[oi])}</span></button>`;
  }).join('');
}
function actsHTML(){
  if(cur.done)return `<button class="btn y" id="nextBtn">${t('next')}</button>`;
  return `${cur.shownOpts||!D().opts?'':`<button class="btn p" id="optBtn">${t('options')}</button>`}
    <button class="btn g" id="okBtn">${t('correct')}</button>
    <button class="btn r" id="noBtn">${t('wrong')}</button>
    ${cur.stolen?'':`<button class="btn ghost" id="backBtn">${t('back')}</button>`}`;
}
function showOpts(){if(!cur||cur.done||cur.shownOpts||!D().opts||!$('opts'))return;cur.shownOpts=true;$('opts').innerHTML=optsHTML();$('acts').innerHTML=actsHTML();save();}
function judge(ok){
  if(!cur||cur.done||!$('opts'))return;
  stopTimer();
  const tm=S.teams[cur.ans];
  if(ok){
    tm.score+=cur.val;cur.done=true;cur.result=`🎉 +${cur.val} ${tm.name}`;
    sfx.win();burst();save();render();drawQ();
  } else if(!cur.stolen&&S.teams.length>1){
    sfx.steal();cur.stolen=true;cur.ans=(cur.ans+1)%S.teams.length;
    drawQ();if($('tb'))$('tb').style.cssText='';startTimer(D().steal);save();
  } else {
    sfx.buzz();cur.done=true;cur.result=t('noPoints');drawQ();save();
  }
}
function startTimer(sec){
  stopTimer();if(!S.timer)return;const t0=Date.now();let last=sec;
  timer=setInterval(()=>{
    const left=sec-(Date.now()-t0)/1000,tb=$('tb');
    if(!tb){stopTimer();return;}
    tb.style.width=Math.max(0,left/sec*100)+'%';
    tb.style.background=left<6?'var(--red)':left<sec/2?'var(--yel)':'var(--grn)';
    const s=Math.ceil(left);if(s!==last&&s<=5&&s>0)sfx.tick();last=s;
    if(left<=0){stopTimer();judge(false);}
  },100);
}
function stopTimer(){clearInterval(timer);timer=null}
function closeQ(finished){
  stopTimer();
  if(finished&&cur){if(!S.used.includes(cur.k))S.used.push(cur.k);S.turn=(S.turn+1)%S.teams.length;}
  cur=null;$('qov').classList.remove('on');save();render();
  if(S.used.length===25)setTimeout(showEnd,400);
}
$('qcard').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='goQ'){drawQ();startTimer(D().time);return;}
  if(b.id==='optBtn'){showOpts();return;}
  if(b.id==='okBtn'){judge(true);return;}
  if(b.id==='noBtn'){judge(false);return;}
  if(b.id==='backBtn'){closeQ(false);return;}
  if(b.id==='nextBtn'){closeQ(true);return;}
  if(b.dataset.o!==undefined&&!cur.done){
    const oi=+b.dataset.o;
    if(oi===0)judge(true);else{cur.wrongOpts.push(oi);judge(false);}
  }
});

$('newBtn').onclick=askNew;
document.addEventListener('keydown',e=>{
  if(!cur||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase(),inQ=!!$('opts');
  if(k==='escape'&&!cur.done&&!cur.stolen){closeQ(false);return;}
  if(!inQ){if(k==='enter'&&$('goQ')){e.preventDefault();drawQ();startTimer(D().time);}return;}
  if(k==='o')showOpts();
  else if(k==='c')judge(true);
  else if(k==='x')judge(false);
  else if(k==='enter'&&cur.done){e.preventDefault();closeQ(true);}
});

MQ.addEventListener('change',render);
render();
if(!S.started||!S.teams.length)openSetup();
else if(S.cur&&S.cur.k&&!S.used.includes(S.cur.k)){
  const [ci,r]=S.cur.k.split('-').map(Number),cat=TH().cats[ci];
  if(cat&&cat.qs[r]){
    cur=Object.assign({ci,r,q:cat.qs[r]},S.cur);
    $('qov').classList.add('on');drawQ();
    if(!cur.done)startTimer(cur.stolen?D().steal:D().time);
  }
} else if(S.used.length===25)showEnd(true);
</script>
</body>
</html>
